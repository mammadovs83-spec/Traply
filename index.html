<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traply — pest control monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f3f0e6; --panel:#ffffff; --ink:#1b211f; --ink-soft:#5b615c; --line:#d4cdb8;
    --accent:#1e5f63; --accent-soft:#dfeceb; --amber:#c9a227; --amber-soft:#f6edcf;
    --danger:#b23a2e; --danger-soft:#f6dcd8; --success:#3f7a4a; --success-soft:#e2ede2; --grey:#9a998f;
    --shadow:0 1px 3px rgba(27,33,31,.06);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg);
    background-image:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
    background-size:20px 20px;
    color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  .app{max-width:1240px; margin:0 auto; padding:18px 18px 48px;}
  .filebanner{display:none; background:var(--amber-soft); border:1px solid var(--amber); color:#6b551a; padding:10px 14px; border-radius:8px; font-size:12.5px; margin-bottom:14px;}
  .filebanner.show{display:block;}

  /* HEADER */
  header{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--panel); border:1.5px solid var(--ink); border-radius:12px;
    padding:12px 16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand-mark{
    width:40px; height:40px; flex:none; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:18px;
    border-radius:8px;
  }
  .brand h1{font-size:22px; margin:0; letter-spacing:.3px; font-family:'Barlow Condensed', sans-serif;}
  .brand p{margin:1px 0 0; color:var(--ink-soft); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:min(420px,55vw);}
  .headctrl{display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px;}
  .rolebar{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
  .rolebar > button{
    border:1.5px solid var(--line); background:var(--panel); color:var(--ink);
    font-weight:600; font-size:12px; padding:6px 11px; border-radius:7px; cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .rolebar > button.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .rolebar > button:hover{border-color:var(--ink);}
  .locsel select{
    border:1.5px solid var(--line); border-radius:7px; padding:6px 10px; font-weight:600;
    font-size:12.5px; background:var(--panel); font-family:'IBM Plex Sans', sans-serif; max-width:220px;
  }
  .langbar{display:inline-flex; border:1.5px solid var(--line); border-radius:7px; overflow:hidden;}
  .langbar button{
    border:none; background:var(--panel); color:var(--ink); font-weight:600; font-size:11px;
    padding:6px 9px; cursor:pointer; border-right:1px solid var(--line); font-family:'IBM Plex Sans', sans-serif;
  }
  .langbar button:last-child{border-right:none;}
  .langbar button.active{background:var(--accent); color:#fff;}
  .langbar button:hover:not(.active){background:var(--accent-soft);}

  /* TABS */
  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; padding:4px 0;}
  .tabs button{
    padding:7px 13px; border:1.5px solid transparent; background:transparent;
    border-radius:8px; font-size:12.5px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif;
    font-weight:500; color:var(--ink-soft); transition:background .12s, color .12s;
  }
  .tabs button:hover{background:rgba(255,255,255,.7); color:var(--ink);}
  .tabs button.active{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600;}

  /* PANELS */
  .panel{background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; box-shadow:var(--shadow);}
  .panel h3{font-family:'Barlow Condensed', sans-serif; font-size:18px; margin:0 0 10px; letter-spacing:.2px;}
  .panel h4{font-family:'Barlow Condensed', sans-serif; font-size:15px; margin:0 0 8px;}
  .grid2{display:grid; grid-template-columns:1.15fr .85fr; gap:14px; align-items:start;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}

  /* STATS */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px;}
  .stat{
    background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:14px 14px 12px; border-bottom:4px solid var(--accent); box-shadow:var(--shadow);
  }
  .stat.danger{border-bottom-color:var(--danger);}
  .stat.amber{border-bottom-color:var(--amber);}
  .stat.grey{border-bottom-color:var(--grey);}
  .stat .num{font-family:'Barlow Condensed', sans-serif; font-size:32px; line-height:1;}
  .stat .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

  .alertbar{
    background:var(--danger); color:#fff; padding:10px 14px; border-radius:8px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px;
  }
  .alertbar button{background:rgba(255,255,255,.22); border:none; color:#fff; border-radius:5px; padding:5px 10px; font-size:11px; cursor:pointer; font-weight:600;}
  .alertbar button:hover{background:rgba(255,255,255,.32);}
  .alertbar.amber{background:var(--amber); color:#3a2f08;}
  .alertbar.amber button{background:rgba(0,0,0,.12); color:#3a2f08;}

  .chartbox{height:220px; position:relative;}
  .btn{
    border:none; background:var(--ink); color:var(--bg); font-weight:600; font-size:13px;
    padding:9px 14px; border-radius:8px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.4; cursor:not-allowed; filter:none;}
  .btn.ghost{background:transparent; border:1.5px solid var(--ink); color:var(--ink);}
  .btn.ghost:hover{background:var(--ink); color:var(--bg);}
  .btn.small{padding:6px 10px; font-size:12px;}
  .btn.danger{background:var(--danger);}
  .btn.block{width:100%;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; color:var(--ink-soft); font-weight:600; padding:8px 8px; border-bottom:1.5px solid var(--ink); text-transform:none;}
  td{padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:hover td{background:rgba(30,95,99,.03);}
  .rowstatus{display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:12px;}
  .thumb-sm{width:32px; height:32px; object-fit:cover; border-radius:5px; border:1px solid var(--line);}

  /* MAP */
  .map-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .type-filter{display:flex; gap:6px; flex-wrap:wrap;}
  .type-chip{padding:5px 10px; border:1.5px solid var(--line); border-radius:16px; font-size:11.5px; cursor:pointer; background:var(--panel);}
  .type-chip:hover{border-color:var(--accent);}
  .type-chip.sel{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;}
  .plan-area{
    position:relative; width:100%; height:min(440px,55vh); background-color:#eee9da;
    background-position:center; background-repeat:no-repeat; background-size:contain;
    border:1px solid var(--line); border-radius:8px; overflow:hidden;
  }
  .plan-area.placing{cursor:crosshair; outline:3px dashed var(--accent); outline-offset:-3px;}
  .plan-empty{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; color:var(--ink-soft); font-size:13px; text-align:center; padding:20px;}
  .zone2{position:absolute; border:1.5px dashed #9c9576; background:rgba(255,255,255,.35); font-size:10px; color:#726c54; padding:3px 5px; pointer-events:none; border-radius:3px;}
  .dev-pt{
    position:absolute; width:28px; height:28px; border-radius:50%; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; font-size:14px; background:var(--panel);
    border:3px solid var(--success); cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.2);
  }
  .dev-pt:hover{transform:translate(-50%,-50%) scale(1.12); z-index:2;}
  .dev-pt.activity{border-color:var(--danger); animation:pulse 1.4s infinite;}
  .dev-pt.damaged{border-color:var(--amber);}
  .dev-pt.missing{border-color:var(--grey); border-style:dashed; opacity:.7;}
  .dev-pt.overdue{border-color:var(--grey);}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(178,58,46,.5);}50%{box-shadow:0 0 0 6px rgba(178,58,46,0);}}
  .legend{display:flex; gap:14px; margin-top:10px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:10px; height:10px; border-radius:50%; display:inline-block;}

  .fieldrow{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
  .fieldrow.full{grid-template-columns:1fr;}
  label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
  input[type=text],input[type=number],input[type=time],input[type=password],select,textarea{
    width:100%; border:1.5px solid var(--line); border-radius:7px; padding:8px 10px;
    font-family:'IBM Plex Sans', sans-serif; font-size:13px; background:var(--panel); transition:border-color .12s;
  }
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  input[type=file]{font-size:12.5px;}
  textarea{resize:vertical; min-height:60px;}

  .drawer-bg{position:fixed; inset:0; background:rgba(0,0,0,.32); z-index:55; display:none; backdrop-filter:blur(2px);}
  .drawer-bg.show{display:block;}
  .drawer{
    position:fixed; top:0; right:0; height:100vh; width:min(340px,92vw); background:var(--panel);
    border-left:2px solid var(--ink); padding:20px; box-shadow:-8px 0 24px rgba(0,0,0,.12);
    transform:translateX(100%); transition:transform .22s ease; z-index:60; overflow-y:auto;
  }
  .drawer.show{transform:translateX(0);}
  .drawer h3{font-family:'Barlow Condensed', sans-serif; font-size:20px; margin:0 0 4px;}
  .drawer .sub{font-size:12px; color:var(--ink-soft); margin-bottom:14px;}

  .modal-bg{display:none; position:fixed; inset:0; background:rgba(27,33,31,.5); align-items:center; justify-content:center; z-index:70; backdrop-filter:blur(2px); padding:16px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--panel); border:2px solid var(--ink); border-radius:12px; padding:22px; width:min(320px,100%); text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.18);}
  .modal h4{margin:0 0 4px; font-family:'Barlow Condensed', sans-serif; font-size:20px;}
  .modal .qrbox{margin:14px auto; width:180px; height:180px; display:flex; align-items:center; justify-content:center; background:#fff;}
  .modal-actions{display:flex; gap:8px; margin-top:10px; justify-content:center; flex-wrap:wrap;}

  .chip{padding:6px 10px; border:1.5px solid var(--line); border-radius:20px; font-size:12px; cursor:pointer; display:inline-block; margin:2px;}
  .chip.sel{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .seg{display:flex; gap:6px;}
  .seg button{flex:1; padding:9px 6px; font-size:12.5px; border:1.5px solid var(--line); background:var(--panel); border-radius:7px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; font-weight:500;}
  .seg button.sel{border-color:var(--ink); background:var(--ink); color:var(--bg);}
  .seg button.sel.danger{background:var(--danger); border-color:var(--danger);}
  .counter{display:flex; align-items:center; gap:10px;}
  .counter button{width:30px; height:30px; border-radius:7px; border:1.5px solid var(--ink); background:var(--panel); cursor:pointer; font-size:16px;}
  .counter span{font-weight:600; font-size:16px; min-width:20px; text-align:center;}

  .tech-wrap{display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; justify-content:center;}
  .phone{width:340px; flex:none; background:var(--panel); border:3px solid var(--ink); border-radius:26px; padding:14px; box-shadow:8px 8px 0 rgba(27,33,31,.1);}
  .phone-notch{width:70px; height:6px; background:var(--ink); border-radius:4px; margin:0 auto 10px;}
  .screen{background:#f6f4ec; border:1px solid var(--line); border-radius:10px; min-height:620px; padding:16px; display:flex; flex-direction:column; gap:11px; position:relative; overflow:hidden;}
  .screen-top{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink-soft);}
  .status-pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;}
  .status-pill.on{background:var(--success-soft); color:var(--success);}
  .status-pill.warn{background:var(--amber-soft); color:#8a6d10;}
  .dotc{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .obj-card{border:1.5px solid var(--line); border-radius:8px; padding:11px; background:var(--panel); display:flex; justify-content:space-between; align-items:center; cursor:pointer; margin-bottom:8px; transition:border-color .12s;}
  .obj-card:hover{border-color:var(--accent);}
  .obj-card b{display:block; font-size:14px;} .obj-card span{font-size:11.5px; color:var(--ink-soft);}
  video.cam{width:100%; border-radius:10px; background:#000; display:block;}
  .cam-wrap{position:relative;} .cam-frame{position:absolute; inset:14%; border:2px solid var(--accent); border-radius:10px; pointer-events:none;}
  .verify-line{font-size:12px; display:flex; gap:6px; align-items:center; color:var(--ink-soft);}
  .verify-line.ok{color:var(--success);} .verify-line.bad{color:var(--danger);}
  .tag{background:var(--panel); border:1.5px solid var(--ink); border-radius:6px; padding:10px 12px; position:relative;}
  .tag::before{content:''; position:absolute; top:-6px; left:14px; width:10px; height:10px; border-radius:50%; background:var(--bg); border:1.5px solid var(--ink);}
  .tag .idl{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft);}
  .tag .name{font-weight:600; font-size:13.5px;}
  .photo-req{border:1.5px dashed var(--danger); background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:10px; font-size:12px; display:flex; flex-direction:column; gap:8px;}
  .photo-thumb{width:100%; border-radius:8px; border:1.5px solid var(--ink);}
  .toast{position:absolute; bottom:14px; left:14px; right:14px; background:var(--ink); color:var(--bg); padding:12px; border-radius:8px; font-size:12.5px; display:flex; justify-content:space-between; align-items:center;}
  .remaining-list{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;}
  .remaining-item{display:flex; justify-content:space-between; align-items:center; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:12.5px; cursor:pointer;}
  .remaining-item:hover{border-color:var(--accent);}

  .empty{padding:28px 16px; text-align:center; color:var(--ink-soft); font-size:13px;}
  .footnote{font-size:11.5px; color:var(--ink-soft); margin-top:8px; line-height:1.45;}
  .audit-item{font-size:12.5px; padding:8px 0; border-bottom:1px solid var(--line); color:var(--ink-soft);}
  .audit-item b{color:var(--ink);}

  .login-wrap{min-height:72vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{background:var(--panel); border:2px solid var(--ink); border-radius:14px; padding:28px; width:100%; max-width:380px; box-shadow:0 8px 28px rgba(27,33,31,.08);}
  .login-card h2{font-family:'Barlow Condensed', sans-serif; font-size:26px; margin:0 0 6px;}
  .login-err{color:var(--danger); font-size:12.5px; margin:8px 0; min-height:18px;}
  .user-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .user-row .meta{color:var(--ink-soft); font-size:11.5px; margin-top:2px;}
  .badge-role{display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; background:var(--accent-soft); color:var(--accent); margin-left:6px;}
  .badge-role.admin{background:var(--ink); color:var(--bg);}
  .badge-role.supervisor{background:var(--amber-soft); color:#6b551a;}
  .badge-role.tech{background:var(--success-soft); color:var(--success);}
  .badge-role.client{background:var(--line); color:var(--ink-soft);}

  @media (max-width: 900px){
    .app{padding:12px 12px 40px;}
    header{padding:12px; align-items:flex-start;}
    .brand p{display:none;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .grid2,.grid3{grid-template-columns:1fr;}
    .fieldrow{grid-template-columns:1fr;}
    .tech-wrap{flex-direction:column; align-items:center;}
    .plan-area{height:320px;}
    .locsel select{max-width:160px;}
  }
  @media (max-width: 520px){
    .stats{grid-template-columns:1fr 1fr;}
    .stat .num{font-size:28px;}
    .phone{width:100%; max-width:340px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="filebanner" id="fileBanner">⚠ Файл открыт как file:// — камера и геопозиция заблокированы браузером. Откройте через http/https-хостинг для полной функциональности. Ручной ввод кода станции доступен всегда.</div>

  <header>
    <div class="brand">
      <div class="brand-mark">T</div>
      <div><h1>Traply</h1><p>Pest control monitoring · site plans · QR rounds · thresholds & trends</p></div>
    </div>
    <div class="headctrl">
      <div class="rolebar" id="roleBar"></div>
      <div class="locsel"><select id="locSelect" onchange="setLocation(this.value)"></select></div>
    </div>
  </header>

  <div id="tabsHost"></div>
  <div id="content"></div>
</div>

<div class="drawer-bg" id="drawerBg" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<div class="modal-bg" id="qrModal">
  <div class="modal">
    <h4 id="qrModalTitle">Устройство</h4>
    <div class="qrbox" id="qrBoxTarget"></div>
    <div class="modal-actions">
      <button class="btn small" onclick="downloadQR()">Скачать PNG</button>
      <button class="btn small ghost" onclick="printQR()">Печать наклейки</button>
    </div>
    <button class="btn ghost small" style="margin-top:10px; width:100%;" onclick="closeQRModal()">Закрыть</button>
  </div>
</div>

<div class="modal-bg" id="devModal">
  <div class="modal" style="width:320px; text-align:left;">
    <h4>Новое устройство</h4>
    <div class="fieldrow full"><div><label>Тип</label><div id="devModalType" class="mono" style="padding:8px 0; font-weight:600;"></div></div></div>
    <div class="fieldrow full"><div><label>Название / расположение</label><input type="text" id="devName" placeholder="напр. Стеллаж D4"></div></div>
    <div class="fieldrow full"><div><label>Зона</label><select id="devZoneSel"></select></div></div>
    <div class="fieldrow full"><div><label>№ на наклейке</label><input type="text" id="devNumber" class="mono" readonly></div></div>
    <div class="modal-actions">
      <button class="btn small" onclick="confirmAddDevice()">Создать и показать QR</button>
      <button class="btn small ghost" onclick="cancelAddDevice()">Отмена</button>
    </div>
  </div>
</div>

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<script>
/* =========================================================
   CONSTANTS
========================================================= */
if(location.protocol === 'file:'){ document.getElementById('fileBanner').classList.add('show'); }

const deviceTypes = {
  rodent_snap:    { label:'Мышеловка',              icon:'🐭', pest:true },
  rodent_bait:    { label:'Приманочная станция',    icon:'📦', pest:true },
  rodent_monitor: { label:'Монитор активности',     icon:'📡', pest:true },
  fly_ilt:        { label:'Мухоловка (ILT)',        icon:'🪰', pest:true },
  insect_monitor: { label:'Клеевой монитор',        icon:'🕸️', pest:true },
  other:          { label:'Контрольная точка',      icon:'✚', pest:false },
};
const pestOptionsByType = {
  rodent_snap:['Мышь','Крыса'], rodent_bait:['Мышь','Крыса'], rodent_monitor:['Мышь','Крыса'],
  fly_ilt:['Муха/летающие'], insect_monitor:['Таракан','Другое насекомое'],
};

/* =========================================================
   I18N — ru / en / az
========================================================= */
const I18N = {
  ru: {

function todayISO(){
  const d = new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function localeTag(){ return (state&&state.lang==='az')?'az-AZ':(state&&state.lang==='en')?'en-GB':'ru-RU'; }
function formatDateTime(isoOrDate){
  try{
    const d = isoOrDate instanceof Date ? isoOrDate : new Date(isoOrDate);
    if(isNaN(d.getTime())) return String(isoOrDate||'—');
    return d.toLocaleString(localeTag(), {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
  }catch(e){ return String(isoOrDate||'—'); }
}
function formatTimeNow(){ return formatDateTime(new Date()); }
function isDeviceCheckedToday(dev){
  if(!dev) return false;
  if(dev.lastVisitDay && dev.lastVisitDay === todayISO()) return true;
  const vis = state.visits||[];
  return vis.some(v=>v.deviceId===dev.id && v.day===todayISO() && v.locationId===(dev.locationId||state.activeLocationId));
}
function deviceProgress(locId){
  const id = locId || state.activeLocationId;
  const devs = state.devices[id]||[];
  const checked = devs.filter(d=>isDeviceCheckedToday(d));
  const pending = devs.filter(d=>!isDeviceCheckedToday(d));
  return { total:devs.length, checked, pending, done:checked.length, left:pending.length };
}
function startOfWeek(d){
  const x = new Date(d); const day = (x.getDay()+6)%7; // Mon=0
  x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x;
}
function isoFromDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function weekRodentChecks(locId){
  const start = startOfWeek(new Date());
  const days=[]; for(let i=0;i<7;i++){ const x=new Date(start); x.setDate(start.getDate()+i); days.push(isoFromDate(x)); }
  const rodentTypes = ['rodent_snap','rodent_bait','rodent_monitor'];
  const devs = (state.devices[locId]||[]).filter(d=>rodentTypes.includes(d.type));
  const vis = (state.visits||[]).filter(v=>v.locationId===locId && days.includes(v.day));
  // count unique days with at least one rodent check
  const daysWith = new Set(vis.filter(v=>{
    const d = (state.devices[locId]||[]).find(x=>x.id===v.deviceId);
    return d && rodentTypes.includes(d.type);
  }).map(v=>v.day));
  return { required:2, done:daysWith.size, days:daysWith, devices:devs.length };
}
function monthCompanyCheck(locId){
  const now = new Date();
  const ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const events = (state.scheduleEvents||[]).filter(e=>e.locationId===locId && e.type==='company' && (e.date||'').startsWith(ym));
  return { required:1, done:events.length, events };
}

async function loadState(){
  // 1) Shared LAN API (server.py → data/state.json)
  try{
    if(location.protocol.startsWith('http')){
      const res = await fetch('/api/state', {cache:'no-store'});
      if(res.ok){
        const data = await res.json();
        if(data && data.locations){ state = data; migrateUsers(); state._sync='api'; return; }
      }
    }
  }catch(e){ console.warn('API load skip', e); }
  try{
    if(hasStorage){
      const r = await window.storage.get('obhod:platform', true);
      if(r && r.value){ state = JSON.parse(r.value); migrateUsers(); state._sync='local'; return; }
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem('obhod:platform');
    if(raw){ state = JSON.parse(raw); migrateUsers(); state._sync='local'; return; }
  }catch(e){}
  state = defaultState();
  state._sync = location.protocol.startsWith('http') ? 'api-new' : 'local';
}
function migrateUsers(){
  if(!state.users || !state.users.length){
    const d = defaultState();
    state.users = d.users;
    state.nextUserId = d.nextUserId;
  }
  if(state.currentUserId && !state.users.find(u=>u.id===state.currentUserId)){
    state.currentUserId = null; state.role = null;
  }
  if(!state.uiTab) state.uiTab = { client:'dashboard', supervisor:'dashboard', admin:'plan', tech:'tech' };
  if(!state.lang) state.lang = localStorage.getItem('obhod:lang') || 'ru';
  if(!state.scheduleEvents) state.scheduleEvents = [];
  if(!state.scheduleRules) state.scheduleRules = { rodentPerWeek:2, companyPerMonth:1 };
}
async function saveState(){
  // strip runtime-only
  const payload = JSON.parse(JSON.stringify(state));
  delete payload._sync;
  try{
    if(location.protocol.startsWith('http')){
      const res = await fetch('/api/state', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      if(res.ok){ state._sync='api'; }
    }
  }catch(e){ console.warn('API save skip', e); }
  try{
    if(hasStorage) await window.storage.set('obhod:platform', JSON.stringify(payload), true);
  }catch(e){ console.warn('storage save failed', e); }
  try{ localStorage.setItem('obhod:platform', JSON.stringify(payload)); }catch(e){}
}

/* =========================================================
   GEO HELPERS
========================================================= */
function distanceMeters(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function offsetCoord(base, dxMeters, dyMeters){
  const dLat = dyMeters/111320;
  const dLng = dxMeters/(111320*Math.cos(base.lat*Math.PI/180));
  return { lat: base.lat+dLat, lng: base.lng+dLng };
}
let baseCoord = { lat:40.4093, lng:49.8671 };
function deviceCoord(dev){
  const dx = (dev.x/100)*40 - 20, dy=(dev.y/100)*30 - 15;
  return offsetCoord(baseCoord, dx, dy);
}

function renderRoot(){
  if(!state.currentUserId || !state.role || !currentUser()){
    renderLogin();
    return;
  }
  renderHeader();
  const tabsHost = document.getElementById('tabsHost');
  const content = document.getElementById('content');
  if(state.role==='tech'){
    if(!can('view.tech')){ doLogout(); return; }
    tabsHost.innerHTML=''; content.innerHTML=''; renderTechRoot(content); return;
  }

  const tabs = allowedTabs();
  if(!tabs.length){ content.innerHTML='<div class="panel"><div class="empty">'+t('no_sections')+'</div></div>'; return; }
  if(!state.uiTab[state.role] || !tabs.find(t=>t[0]===state.uiTab[state.role])) state.uiTab[state.role]=tabs[0][0];
  // guard: tab must be allowed
  if(!tabs.find(t=>t[0]===state.uiTab[state.role])) state.uiTab[state.role]=tabs[0][0];
  tabsHost.innerHTML = `<div class="tabs">${tabs.map(([id,l])=>`<button class="${state.uiTab[state.role]===id?'active':''}" onclick="setTab('${id}')">${l}</button>`).join('')}</div>`;

function resetUserForm(){
  document.getElementById('editUserId').value = '';
  document.getElementById('userFormTitle').textContent = t('users_add');
  document.getElementById('ufName').value = '';
  document.getElementById('ufLogin').value = '';
  document.getElementById('ufPass').value = '';
  document.getElementById('ufRole').value = 'tech';
}
function editUser(id){
  const u = state.users.find(x=>x.id===id); if(!u) return;
  document.getElementById('editUserId').value = u.id;
  document.getElementById('userFormTitle').textContent = t('users_edit')+': '+u.login;
  document.getElementById('ufName').value = u.name||'';
  document.getElementById('ufLogin').value = u.login;
  document.getElementById('ufPass').value = u.password;
  document.getElementById('ufRole').value = u.role;
  document.getElementById('userFormPanel').scrollIntoView({behavior:'smooth'});
}
function saveUserForm(){
  if(!requirePerm('edit.users')) return;
  const id = document.getElementById('editUserId').value;
  const name = document.getElementById('ufName').value.trim();
  const login = document.getElementById('ufLogin').value.trim();
  const password = document.getElementById('ufPass').value;
  const role = document.getElementById('ufRole').value;
  if(!login || !password){ alert('Укажите логин и пароль'); return; }
  const dup = state.users.find(x=>x.login===login && x.id!==id);
  if(dup){ alert('Такой логин уже занят'); return; }
  if(id){
    const u = state.users.find(x=>x.id===id);
    if(!u) return;
    // нельзя снять последнего активного админа
    if(u.role==='admin' && role!=='admin'){
      const admins = state.users.filter(x=>x.role==='admin' && x.active!==false && x.id!==id);
      if(!admins.length){ alert('Должен остаться хотя бы один активный админ'); return; }
    }
    u.name = name||login; u.login = login; u.password = password; u.role = role;
    logAudit('Изменён пользователь '+login+' ('+roleLabel(role)+')');
  } else {
    const nid = 'U'+(state.nextUserId||10);
    state.nextUserId = (state.nextUserId||10)+1;
    state.users.push({id:nid, login, password, name:name||login, role, active:true});
    logAudit('Создан пользователь '+login+' ('+roleLabel(role)+')');
  }
  saveState();
  renderRoot();
}
function toggleUserActive(id){
  if(!requirePerm('edit.users')) return;
  const u = state.users.find(x=>x.id===id); if(!u) return;
  if(u.active!==false){
    if(u.role==='admin'){
      const admins = state.users.filter(x=>x.role==='admin' && x.active!==false && x.id!==id);
      if(!admins.length){ alert('Нельзя отключить последнего админа'); return; }
    }
    if(u.id===state.currentUserId){ alert('Нельзя отключить текущего пользователя'); return; }
    u.active = false;
    logAudit('Отключён пользователь '+u.login);
  } else {
    u.active = true;
    logAudit('Включён пользователь '+u.login);
  }
  saveState(); renderRoot();
}
function deleteUser(id){
  if(!requirePerm('edit.users')) return;
  const u = state.users.find(x=>x.id===id); if(!u) return;
  if(u.id===state.currentUserId){ alert('Нельзя удалить текущего пользователя'); return; }
  if(u.role==='admin'){
    const admins = state.users.filter(x=>x.role==='admin' && x.active!==false && x.id!==id);
    if(!admins.length){ alert('Нельзя удалить последнего админа'); return; }
  }
  if(!confirm('Удалить пользователя '+u.login+'?')) return;
  state.users = state.users.filter(x=>x.id!==id);
  logAudit('Удалён пользователь '+u.login);
  saveState(); renderRoot();
}

function renderAlertBar(a){
  if(a.type==='threshold') return `<div class="alertbar"><span>⚠ <b>${t('alert_threshold')}:</b> ${a.pest} — ${a.count} · ${deviceLabel(a.deviceId)} (${a.time})</span><button onclick="ackAlert('${a.id}')">${t('alert_ack')}</button></div>`;
  if(a.type==='shift') return `<div class="alertbar"><span>⚠ <b>${t('alert_shift')}:</b> ${a.count} (${a.time})</span><button onclick="ackAlert('${a.id}')">${t('alert_ack')}</button></div>`;
  if(a.type==='device') return `<div class="alertbar amber"><span>🔧 ${t('alert_device')} ${deviceLabel(a.deviceId)}: ${a.issue==='damaged'?t('alert_damaged'):t('alert_missing')} (${a.time})</span><button onclick="ackAlert('${a.id}')">${t('alert_ack')}</button></div>`;
  return '';
}
function ackAlert(id){ if(!requirePerm('ack.alerts')) return; const a = state.alerts.find(x=>x.id===id); if(a){ a.ack=true; saveState(); renderRoot(); } }
function deviceLabel(id){ const d = curDevices().find(x=>x.id===id); return d ? `№ ${d.number} (${d.name})` : id; }

      <td><span class="rowstatus" style="color:${sm.c}"><i class="dotc" style="width:7px;height:7px;border-radius:50%;background:currentColor;"></i>${v.summary}</span></td>

/* =========================================================
   CHARTS
========================================================= */
function last30Days(){
  const arr=[]; const d=new Date();
  for(let i=29;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); arr.push(x.toISOString().slice(0,10)); }
  return arr;
}
function drawTrendChart(canvasId, vis){
  const ctx = document.getElementById(canvasId); if(!ctx || typeof Chart==='undefined') return;
  const days = last30Days();
  const counts = days.map(day=>vis.filter(v=>v.day===day && v.result==='activity').length);
  if(chartRefs[canvasId]) chartRefs[canvasId].destroy();
  chartRefs[canvasId] = new Chart(ctx, {
    type:'line',
    data:{ labels:days.map(d=>d.slice(5)), datasets:[{ label:t('chart_incidents'), data:counts, borderColor:'#b23a2e', backgroundColor:'rgba(178,58,46,0.12)', tension:.25, fill:true, pointRadius:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ ticks:{ maxTicksLimit:8, font:{size:10} } }, y:{ beginAtZero:true, ticks:{ precision:0 } } } }
  });
}
function drawZoneChart(canvasId, vis){
  const ctx = document.getElementById(canvasId); if(!ctx || typeof Chart==='undefined') return;
  const zones = curZones();
  const counts = zones.map(z=>vis.filter(v=>v.zoneId===z.id && v.result==='activity').length);
  if(chartRefs[canvasId]) chartRefs[canvasId].destroy();
  chartRefs[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{ labels:zones.map(z=>z.name), datasets:[{ data:counts, backgroundColor:'#1e5f63' }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ ticks:{ font:{size:9} } }, y:{ beginAtZero:true, ticks:{ precision:0 } } } }
  });
}
function drawPestChart(canvasId, vis){
  const ctx = document.getElementById(canvasId); if(!ctx || typeof Chart==='undefined') return;
  const pests = {};
  vis.filter(v=>v.result==='activity').forEach(v=>{ pests[v.pest||'Другое'] = (pests[v.pest||'Другое']||0)+ (v.count||1); });
  const labels = Object.keys(pests); const data = Object.values(pests);
  if(chartRefs[canvasId]) chartRefs[canvasId].destroy();
  chartRefs[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor:'#c9a227' }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, indexAxis:'y', scales:{ x:{ beginAtZero:true, ticks:{ precision:0 } } } }
  });
}

function renderCalendarTab(el){
  if(!can('view.calendar')){ el.innerHTML='<div class="panel"><div class="empty">'+t('denied')+'</div></div>'; return; }
  const loc = curLoc();
  const w = weekRodentChecks(loc.id);
  const m = monthCompanyCheck(loc.id);
  const rules = state.scheduleRules || {rodentPerWeek:2, companyPerMonth:1};
  const wOk = w.done >= (rules.rodentPerWeek||2);
  const mOk = m.done >= (rules.companyPerMonth||1);
  // simple month grid
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth();
  const first = new Date(y, mo, 1);
  const startPad = (first.getDay()+6)%7;
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const visDays = new Set((state.visits||[]).filter(v=>v.locationId===loc.id && (v.day||'').startsWith(y+'-'+String(mo+1).padStart(2,'0'))).map(v=>v.day));
  const companyDays = new Set((state.scheduleEvents||[]).filter(e=>e.locationId===loc.id && e.type==='company').map(e=>e.date));
  let cells = '';
  for(let i=0;i<startPad;i++) cells += '<div style="padding:8px;"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const iso = y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const hasVis = visDays.has(iso);
    const hasCo = companyDays.has(iso);
    const isToday = iso===todayISO();
    cells += `<div style="padding:8px 4px; border-radius:6px; text-align:center; font-size:12px; border:1px solid ${isToday?'var(--accent)':'var(--line)'}; background:${hasCo?'var(--amber-soft)':hasVis?'var(--success-soft)':'var(--panel)'};">
      <div style="font-weight:600;">${d}</div>
      <div style="font-size:10px; color:var(--ink-soft);">${hasCo?'🏢':hasVis?'✓':''}</div>
    </div>`;
  }
  el.innerHTML = `
    <div class="panel">
      <h3>${t('cal_title')} — ${loc.name}</h3>
      <p class="footnote">${t('cal_rule_rodent')}<br>${t('cal_rule_company')}</p>
      <div class="grid2" style="margin-top:12px;">
        <div class="stat ${wOk?'':'danger'}" style="border-bottom-width:4px;">
          <div class="lbl">${t('cal_week')}</div>
          <div class="num">${w.done} / ${rules.rodentPerWeek||2}</div>
          <div class="lbl">${wOk?t('cal_done'):t('cal_need')}</div>
        </div>
        <div class="stat ${mOk?'':'amber'}" style="border-bottom-width:4px;">
          <div class="lbl">${t('cal_month')}</div>
          <div class="num">${m.done} / ${rules.companyPerMonth||1}</div>
          <div class="lbl">${mOk?t('cal_done'):t('cal_need')}</div>
        </div>
      </div>
      <button class="btn small" style="margin-top:12px;" onclick="markCompanyInspection()">${t('cal_add_company')}</button>
    </div>
    <div class="panel">
      <h3>${now.toLocaleString(localeTag(),{month:'long', year:'numeric'})}</h3>
      <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:8px;">
        ${['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>`<div style="text-align:center; font-size:10px; color:var(--ink-soft); font-weight:600;">${x}</div>`).join('')}
        ${cells}
      </div>
      <p class="footnote">✓ — ${t('rounds_checked')} · 🏢 — company</p>
    </div>`;
}
function markCompanyInspection(){
  if(!requirePerm('edit.schedule')) return;
  const date = todayISO();
  state.scheduleEvents = state.scheduleEvents||[];
  if(state.scheduleEvents.some(e=>e.locationId===state.activeLocationId && e.type==='company' && e.date===date)){
    alert('OK'); return;
  }
  state.scheduleEvents.push({
    id:'SE'+Date.now().toString(36),
    locationId:state.activeLocationId,
    type:'company',
    date,
    by: currentUser()?.name||currentUser()?.login||'—',
    note:'Company deratization / inspection'
  });
  logAudit('Company inspection marked '+date);
  saveState(); renderRoot();
}

let zoneDraw = null;
function renderAdminZonesTab(el){

    </div>

      </tbody></table>
    </div>
  `;
  drawZonesEditable();
  attachZoneDrawHandlers();
}
function toggleZoneDraw(){
  zoneDraw = zoneDraw ? null : {active:true};
  document.getElementById('zoneDrawBtn').classList.toggle('active');
  document.getElementById('planAreaZones').classList.toggle('placing', !!zoneDraw);
}
function drawZonesEditable(){
  const el = document.getElementById('planAreaZones'); if(!el) return;
  el.innerHTML = curZones().map(z=>`<div class="zone2" style="left:${z.x}%; top:${z.y}%; width:${z.w}%; height:${z.h}%;">${z.name}</div>`).join('');
}
function attachZoneDrawHandlers(){
  const el = document.getElementById('planAreaZones'); if(!el) return;
  let start=null, tempDiv=null;
  el.onmousedown = e=>{
    if(!zoneDraw) return;
    const r = el.getBoundingClientRect();
    start = { x:(e.clientX-r.left)/r.width*100, y:(e.clientY-r.top)/r.height*100 };
    tempDiv = document.createElement('div'); tempDiv.className='zone2'; tempDiv.style.left=start.x+'%'; tempDiv.style.top=start.y+'%';
    el.appendChild(tempDiv);
  };
  el.onmousemove = e=>{
    if(!zoneDraw || !start) return;
    const r = el.getBoundingClientRect();
    const cx=(e.clientX-r.left)/r.width*100, cy=(e.clientY-r.top)/r.height*100;
    const x=Math.min(start.x,cx), y=Math.min(start.y,cy), w=Math.abs(cx-start.x), h=Math.abs(cy-start.y);
    tempDiv.style.left=x+'%'; tempDiv.style.top=y+'%'; tempDiv.style.width=w+'%'; tempDiv.style.height=h+'%';
  };
  el.onmouseup = e=>{
    if(!zoneDraw || !start) return;
    const r = el.getBoundingClientRect();
    const cx=(e.clientX-r.left)/r.width*100, cy=(e.clientY-r.top)/r.height*100;
    const x=Math.min(start.x,cx), y=Math.min(start.y,cy), w=Math.abs(cx-start.x), h=Math.abs(cy-start.y);
    start=null; tempDiv.remove();
    if(w<2||h<2) return;
    const name = prompt('Название зоны:'); if(!name) return;
    const id = 'Z'+(curZones().length+1)+'_'+Date.now().toString(36).slice(-4);
    curZones().push({id, name, x, y, w, h});
    logAudit(`Добавлена зона «${name}»`);
    saveState(); renderAdminZonesTab(document.getElementById('content'));
  };
}
function deleteZone(id){
  if(!requirePerm('edit.zones')) return;
  if(!confirm('Удалить зону? Устройства в ней останутся без привязки.')) return;
  state.zones[state.activeLocationId] = curZones().filter(z=>z.id!==id);
  logAudit(`Удалена зона ${id}`); saveState(); renderAdminZonesTab(document.getElementById('content'));
}

      <div style="flex:1; min-width:260px; padding-top:6px;">
        <h3 style="font-family:'Barlow Condensed'; font-size:20px; margin:0 0 8px;">${t('tech_how')}</h3>
        <p style="color:var(--ink-soft); font-size:14px; line-height:1.55;">${t('tech_how_text')}</p>
        <div class="flowsteps" id="flowsteps" style="border-left:2px solid var(--line); padding-left:16px; margin-left:4px;"></div>
      </div>
    </div>
  `;
  renderTech();
}
function renderFlowsteps(){
  document.getElementById('flowsteps').innerHTML = flowLabels().map((l,i)=>
    `<div class="flowstep ${i<=tech.step?'done':''}" style="position:relative; padding:0 0 20px; font-size:13.5px; color:${i<=tech.step?'var(--ink)':'var(--ink-soft)'};"><b>${i+1}.</b> ${l}</div>`).join('');
}
function stopCamera(){ if(tech.cameraStream){ tech.cameraStream.getTracks().forEach(t=>t.stop()); tech.cameraStream=null; } tech.scanning=false; }

async function startCameraStreamOnly(){
  const video = document.getElementById('camVideo'); if(!video) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    tech.cameraStream = stream; video.srcObject = stream; await video.play();
    tech.scanning = true; scanLoop();
  }catch(err){
    const s = document.getElementById('camStatus');
    if(s) s.innerHTML = `Камера недоступна (${err.message||'нет разрешения'}). Введите код станции вручную ниже.`;
  }
}
function scanLoop(){
  if(!tech.scanning) return;
  const video = document.getElementById('camVideo'); const canvas = document.getElementById('hiddenCanvas');
  if(video && video.readyState===video.HAVE_ENOUGH_DATA && typeof jsQR==='function'){
    canvas.width=video.videoWidth; canvas.height=video.videoHeight;
    const ctx = canvas.getContext('2d'); ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const img = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = jsQR(img.data, img.width, img.height);
    if(code && code.data && code.data.startsWith('PC|')){
      const parts = code.data.split('|'); const devId = parts[2];
      const dev = state.devices[state.activeLocationId].find(d=>d.id===devId);
      if(dev){ stopCamera(); openDeviceAfterScan(dev); return; }
    }
  }
  requestAnimationFrame(scanLoop);
}
function manualSubmit(){
  const val = document.getElementById('manualCode').value.trim();
  const dev = curDevices().find(d=>d.number===val || d.id===val);
  if(!dev){ document.getElementById('manualErr').textContent='Устройство с таким номером не найдено.'; return; }
  stopCamera(); openDeviceAfterScan(dev);
}
function openDeviceAfterScan(dev){
  tech.current = dev;
  tech.form = { state:'ok', result:null, pest:null, count:1, alive:null, actions:[], photo:null, note:'' };
  tech.geo = { status:'checking', distance:null, accuracy:null, override:false };
  tech.step = 3; renderTech(); runGeoCheck();
}
function runGeoCheck(){
  if(!navigator.geolocation){ tech.geo.status='unsupported'; renderTech(); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude, longitude, accuracy} = pos.coords;
    const c = deviceCoord(tech.current);
    tech.geo.status='done'; tech.geo.distance = distanceMeters(latitude,longitude,c.lat,c.lng); tech.geo.accuracy = accuracy;
    renderTech();
  }, err=>{ tech.geo.status='error'; tech.geo.errMsg = err.message; renderTech(); }, { enableHighAccuracy:true, timeout:8000 });
}
async function capturePhoto(){
  const video = document.getElementById('photoVideo');
  try{
    if(!tech.cameraStream){ tech.cameraStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } }); }
    video.srcObject = tech.cameraStream; await video.play();
    setTimeout(()=>{
      const canvas = document.getElementById('hiddenCanvas');
      const w = video.videoWidth||320, h = video.videoHeight||240;
      const scale = Math.min(1, 320/w);
      canvas.width = w*scale; canvas.height = h*scale;
      canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
      tech.form.photo = canvas.toDataURL('image/jpeg', 0.5);
      stopCamera(); renderTech();
    }, 700);
  }catch(err){ alert('Нет доступа к камере: '+(err.message||'разрешение не предоставлено')); }
}
function setForm(k,v){ tech.form[k]=v; renderTech(); }
function bumpCount(d){ tech.form.count = Math.max(1, tech.form.count+d); renderTech(); }
function toggleAction(a){ const i=tech.form.actions.indexOf(a); if(i===-1) tech.form.actions.push(a); else tech.form.actions.splice(i,1); renderTech(); }
function canSaveTech(){
  const f = tech.form, dev = tech.current;
  if(!f.result) return false;
  if(f.result!=='clean' && deviceTypes[dev.type].pest){
    if(dev.type.startsWith('rodent') && (!f.pest || !f.alive)) return false;
    if(dev.type==='insect_monitor' && !f.pest) return false;
    if(!f.photo) return false;
  }
  if(f.result==='anomaly' && !f.photo) return false;
  if(tech.geo.status==='done' && tech.geo.distance>15 && !tech.geo.override) return false;
  return true;
}
async function saveVisit(){
  if(!requirePerm('edit.visits')) return;
  const dev = tech.current, f = tech.form;
  const isPest = deviceTypes[dev.type].pest;
  const newDeviceStatus = f.state==='damaged'?'damaged' : f.state==='lost'?'missing' : (f.result!=='clean' && isPest ? 'activity' : (f.result==='anomaly'?'activity':'ok'));
  const now = new Date();
  const timeStr = formatDateTime(now);
  dev.status = newDeviceStatus;
  dev.lastVisitAt = timeStr;
  dev.lastVisitDay = todayISO();
  dev.lastVisitTs = now.toISOString();
  dev.lastTech = (currentUser()?.name||currentUser()?.login||'—');

  let summary = t('status_ok');
  if(isPest && f.result!=='clean') summary = `${f.pest} — ${f.count}${f.alive?', '+(f.alive==='alive'?'alive':'dead'):''}`;
  if(!isPest && f.result==='anomaly') summary = f.note||'anomaly';

  const visit = { id:'V'+Date.now().toString(36), locationId:state.activeLocationId, deviceId:dev.id, zoneId:dev.zoneId,
    time:timeStr, ts:now.toISOString(), result: isPest ? (f.result==='clean'?'clean':'activity') : (f.result==='anomaly'?'activity':'clean'),
    summary, tech:dev.lastTech, photo:f.photo, pest:f.pest, count:f.count, day: todayISO() };
  state.visits.unshift(visit);

  if(f.state==='damaged') pushAlert({type:'device', deviceId:dev.id, issue:'damaged'});
  if(f.state==='lost') pushAlert({type:'device', deviceId:dev.id, issue:'missing'});
  if(isPest && f.result!=='clean'){
    const th = curThresholds()[f.pest];
    if(th && f.count>=th) pushAlert({type:'threshold', deviceId:dev.id, pest:f.pest, count:f.count});
    const todayIncidents = state.visits.filter(v=>v.locationId===state.activeLocationId && v.day===todayISO() && v.result==='activity').length;
    if(todayIncidents>=curThresholds().shift) pushAlert({type:'shift', count:todayIncidents});
  }

  if(navigator.onLine){ await saveState(); } else { outbox.push(visit.id); }
  tech.step = 5; renderTech();
}
function pushAlert(a){
  state.alerts.unshift({ id:'AL'+Date.now().toString(36), locationId:state.activeLocationId, time:formatDateTime(new Date()), ack:false, ...a });
}
window.addEventListener('online', async ()=>{ if(outbox.length){ await saveState(); outbox=[]; } renderTech(); });
window.addEventListener('offline', renderTech);

function renderTech(){
  renderFlowsteps();
  const s = document.getElementById('screen'); if(!s) return;
  const online = navigator.onLine;
  const netPill = online ? `<span class="status-pill on"><i class="dotc"></i>${t('online')}</span>` : `<span class="status-pill warn"><i class="dotc"></i>${t('offline')}${outbox.length?` · ${outbox.length} ${t('in_queue')}`:''}</span>`;

  if(tech.step===0){
    s.innerHTML = `<div class="screen-top"><span class="mono">${nowTime()}</span>${netPill}</div>
      <div style="font-family:'Barlow Condensed'; font-size:22px; margin-top:6px;">${t('choose_object')}</div>
      ${state.locations.map(l=>`<div class="obj-card" onclick="setLocation('${l.id}'); tech.step=1; renderTech();"><div><b>${l.name}</b><span>${(state.devices[l.id]||[]).length} ${t('devices_count')}</span></div><div class="mono" style="font-size:18px;">›</div></div>`).join('')}`;
  } else if(tech.step===1){
    const prog = deviceProgress();
    const pending = prog.pending;
    const checked = prog.checked;
    s.innerHTML = `<div class="screen-top"><span class="mono">${nowTime()}</span>${netPill}</div>
      <div style="font-family:'Barlow Condensed'; font-size:20px;">${curLoc().name}</div>
      <div style="font-size:13px; color:var(--ink-soft); margin-bottom:4px;">${t('progress_today')}: <b>${prog.done}/${prog.total}</b></div>
      <div style="height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:10px;"><div style="height:100%; width:${prog.total?Math.round(100*prog.done/prog.total):0}%; background:var(--success);"></div></div>
      <button class="btn" onclick="tech.step=2; renderTech();">📷 ${t('scan_qr')}</button>
      <div class="field"><label>${t('remaining')} (${pending.length})</label>
        <div class="remaining-list">${pending.length ? pending.map(d=>`<div class="remaining-item" onclick="openDeviceAfterScan(curDevices().find(x=>x.id==='${d.id}'))"><span>${deviceTypes[d.type].icon} № ${d.number} — ${d.name}</span><span class="mono" style="color:var(--danger);">○</span></div>`).join('') : '<div class="empty" style="padding:10px 0;">'+t('all_done')+'</div>'}</div>
      </div>
      <div class="field"><label>${t('checked_today')} (${checked.length})</label>
        <div class="remaining-list">${checked.length ? checked.map(d=>`<div class="remaining-item" style="opacity:.85;"><span>${deviceTypes[d.type].icon} № ${d.number} — ${d.name}</span><span class="mono" style="color:var(--success);">✓ ${d.lastVisitAt||''}</span></div>`).join('') : '<div class="empty" style="padding:8px 0; font-size:12px;">—</div>'}</div>
      </div>`;
  } else if(tech.step===2){
    s.innerHTML = `<div class="screen-top"><span class="mono">${nowTime()}</span><span class="status-pill on"><i class="dotc"></i>${t('online')}</span></div>
      <div class="cam-wrap"><video id="camVideo" class="cam" muted playsinline></video><div class="cam-frame"></div></div>
      <div class="verify-line" id="camStatus">${t('cam_hint')}</div>
      <div class="field"><label>${t('manual_code')}</label><input type="text" id="manualCode" class="mono" placeholder="44"><div id="manualErr" style="color:var(--danger); font-size:11px; margin-top:4px;"></div></div>
      <button class="btn ghost small" onclick="manualSubmit()">${t('confirm_num')}</button>
      <button class="btn ghost small" onclick="stopCamera(); tech.step=1; renderTech();">${t('cancel')}</button>`;
    startCameraStreamOnly();
  } else if(tech.step===3){
    const dev = tech.current, g = tech.geo;
    let geoBlock='';
    if(g.status==='checking') geoBlock=`<div class="verify-line">⏳ ${t('geo_checking')}</div>`;
    else if(g.status==='error') geoBlock=`<div class="verify-line bad">✕ GPS: ${g.errMsg}</div><label style="font-size:11px; display:flex; gap:6px; align-items:center; margin-top:4px;"><input type="checkbox" onchange="tech.geo.override=this.checked; renderTech();"> ${t('geo_manual')}</label>`;
    else if(g.status==='unsupported') geoBlock=`<div class="verify-line bad">✕ ${t('geo_unsupported')}</div>`;
    else if(g.status==='done'){
      const ok = g.distance<=15;
      geoBlock = `<div class="verify-line ${ok?'ok':'bad'}">${ok?'✓':'⚠'} GPS: ${g.distance.toFixed(1)} m (±${g.accuracy.toFixed(0)} m)</div>`;
      if(!ok) geoBlock += `<label style="font-size:11px; display:flex; gap:6px; align-items:center; margin-top:4px;"><input type="checkbox" onchange="tech.geo.override=this.checked; renderTech();"> ${t('geo_manual')}</label>`;
    }
    s.innerHTML = `<div class="screen-top"><span class="mono">${nowTime()}</span><span class="status-pill on"><i class="dotc"></i>OK</span></div>
      <div class="tag"><div class="idl">${deviceTypes[dev.type].icon} № ${dev.number}</div><div class="name">${dev.name}</div><div style="font-size:11.5px; color:var(--ink-soft);">${zoneName(dev.zoneId)}</div></div>
      <div style="display:flex; flex-direction:column; gap:8px;"><div class="verify-line ok">✓ QR</div>${geoBlock}<div class="verify-line ok">✓ ${formatDateTime(new Date())}</div></div>
      <button class="btn" style="margin-top:auto;" ${g.status==='checking'?'disabled':''} onclick="tech.step=4; renderTech();">${t('open_form')}</button>`;
  } else if(tech.step===4){
    s.innerHTML = renderVisitForm();
  } else if(tech.step===5){
    s.innerHTML = `<div class="screen-top"><span class="mono">${nowTime()}</span>${netPill}</div>
      <div class="toast"><span>№ ${tech.current.number} ✓ ${formatDateTime(new Date())}${navigator.onLine?'':' ('+t('in_queue')+')'}</span></div>
      <button class="btn" style="margin-top:auto;" onclick="tech.step=1; renderTech();">${t('back_list')}</button>`;
  }
}
function renderVisitForm(){
  const dev = tech.current, f = tech.form, type = dev.type, meta = deviceTypes[type];
  let resultBlock='';
  if(meta.pest){
    resultBlock = `<div class="field"><label>${t('visit_result')}</label><div class="seg">
      <button class="${f.result==='clean'?'sel':''}" onclick="setForm('result','clean')">${t('status_ok')}</button>
      <button class="${f.result==='pest'?'sel danger':''}" onclick="setForm('result','pest')">${t('status_activity')}</button>
    </div></div>`;
    if(f.result==='pest'){
      resultBlock += `<div class="field"><label>${t('col_species')}</label><div>${pestOptionsByType[type].map(p=>`<div class="chip ${f.pest===p?'sel':''}" onclick="setForm('pest','${p}')">${p}</div>`).join('')}</div></div>
      <div class="field"><label>${t('visit_count')}</label><div class="counter"><button onclick="bumpCount(-1)">–</button><span>${f.count}</span><button onclick="bumpCount(1)">+</button></div></div>`;
      if(type.startsWith('rodent')) resultBlock += `<div class="field"><label>${t('visit_alive')}</label><div class="seg"><button class="${f.alive==='alive'?'sel':''}" onclick="setForm('alive','alive')">${t('alive')}</button><button class="${f.alive==='dead'?'sel':''}" onclick="setForm('alive','dead')">${t('dead')}</button></div></div>`;
      const actionOpts = type.startsWith('rodent') ? [t('act_bait'),t('act_insert'),t('act_disinfect')] : type==='fly_ilt' ? [t('act_glue'),t('act_lamp')] : [t('act_clean')];
      resultBlock += `<div class="field"><label>${t('visit_actions')}</label><div>${actionOpts.map(a=>`<div class="chip ${f.actions.includes(a)?'sel':''}" onclick="toggleAction('${a}')">${a}</div>`).join('')}</div></div>
      <div class="photo-req">📷 ${t('photo_req')} ${f.photo?`<img class="photo-thumb" src="${f.photo}">`:''}<video id="photoVideo" class="cam" style="display:none;" muted playsinline></video><button class="btn small ${f.photo?'ghost':''}" onclick="capturePhoto()">${f.photo?t('photo_retake'):t('photo_take')}</button></div>`;
    }
  } else {
    resultBlock = `<div class="field"><label>${t('visit_result')}</label><div class="seg">
      <button class="${f.result==='clean'?'sel':''}" onclick="setForm('result','clean')">OK</button>
      <button class="${f.result==='anomaly'?'sel danger':''}" onclick="setForm('result','anomaly')">${t('anomaly')}</button>
    </div></div>`;
    if(f.result==='anomaly'){
      resultBlock += `<div class="field"><label>${t('comment')}</label><textarea onchange="setForm('note', this.value)">${f.note}</textarea></div>
      <div class="photo-req">📷 ${t('photo_req')} ${f.photo?`<img class="photo-thumb" src="${f.photo}">`:''}<video id="photoVideo" class="cam" style="display:none;" muted playsinline></video><button class="btn small ${f.photo?'ghost':''}" onclick="capturePhoto()">${f.photo?t('photo_retake'):t('photo_take')}</button></div>`;
    }
  }
  return `<div class="screen-top"><span class="mono">${nowTime()}</span><span class="status-pill on"><i class="dotc"></i>form</span></div>
    <div class="tag"><div class="idl">${meta.icon} № ${dev.number}</div><div class="name">${dev.name}</div></div>
    <div class="field"><label>${t('device_state')}</label><div class="seg">
      <button class="${f.state==='ok'?'sel':''}" onclick="setForm('state','ok')">${t('state_ok')}</button>
      <button class="${f.state==='damaged'?'sel danger':''}" onclick="setForm('state','damaged')">${t('status_damaged')}</button>
      <button class="${f.state==='lost'?'sel danger':''}" onclick="setForm('state','lost')">${t('state_lost')}</button>
    </div></div>
    ${resultBlock}
    <button class="btn" style="margin-top:auto;" ${canSaveTech()?'':'disabled'} onclick="saveVisit()">${t('save_next')}</button>`;
}

/* =========================================================
   INIT
========================================================= */
(async function init(){
  await loadState();
  if(state && state.lang) try{ localStorage.setItem('obhod:lang', state.lang); }catch(e){}
  document.documentElement.lang = (state && state.lang==='az') ? 'az' : ((state && state.lang==='en') ? 'en' : 'ru');
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{ baseCoord = { lat:pos.coords.latitude, lng:pos.coords.longitude }; }, ()=>{}, { timeout:5000 });
  }
  renderRoot();
})();
</script>
</body>
</html>
